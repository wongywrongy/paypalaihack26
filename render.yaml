# Paid API, worker, and PostgreSQL. Review current Render prices before deployment.
# Use same-site custom domains, e.g. shop.example.com and api.example.com, for buyer cookies.
databases:
  - name: coalition-db
    databaseName: coalition
    user: coalition
    plan: 0.1c-256mb
    postgresMajorVersion: "16"
    ipAllowList: []
envVarGroups:
  - name: coalition-shared
    envVars:
      - key: COALITION_MODE
        value: connected
      - key: OPERATOR_TOKEN
        generateValue: true
      - key: LLM_MODEL
        value: qwen3:30b-a3b-instruct-2507-q4_K_M
      - key: LLM_BASE_URL
        value: ""
      - key: LLM_PROTOCOL
        value: ollama
      - key: PAYPAL_PAYMENTS_RETRY_HOURS
        value: "0"
# Set PUBLIC_URL, PayPal credentials/merchant/webhook IDs, and LLM_API_KEY in this
# shared group in the dashboard. sync:false is unsupported inside envVarGroups.
services:
  - type: web
    name: coalition-api
    runtime: python
    plan: 0.5c-512mb
    buildCommand: pip install -r backend/requirements.txt
    preDeployCommand: PYTHONPATH=backend python -m coalition.db
    startCommand: PYTHONPATH=backend uvicorn coalition.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - fromGroup: coalition-shared
      - key: DATABASE_URL
        fromDatabase: { name: coalition-db, property: connectionString }
  - type: worker
    name: coalition-worker
    runtime: python
    plan: 0.5c-512mb
    numInstances: 1
    buildCommand: pip install -r backend/requirements.txt
    startCommand: PYTHONPATH=backend python -m coalition.worker
    envVars:
      - fromGroup: coalition-shared
      - key: DATABASE_URL
        fromDatabase: { name: coalition-db, property: connectionString }
  - type: web
    name: coalition-storefront
    runtime: static
    buildCommand: npm ci --prefix frontend && npm run build --prefix frontend
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
