<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rally — tell us what you want</title>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B4235A}a:hover{color:#8E1A47}
</style>

</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F4F0; color: #17161A; font-family: 'Schibsted Grotesk', system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="display: flex; align-items: center; gap: 8px; padding: 12px 12px 8px">
    <a href="1-invite.html" aria-label="Back" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 12px; color: #17161A">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <span style="font-weight: 700; font-size: 16px">What do you want?</span>
  </div>

  <div style="flex: 1; padding: 8px 20px; display: flex; flex-direction: column; gap: 14px">
    <div style="align-self: flex-end; max-width: 290px; background: #17161A; color: #FFFFFF; border-radius: 18px 18px 4px 18px; padding: 12px 14px; font-size: 15px; line-height: 1.45">Snail essence, the rice toner and a box of cica masks. Under $75 all in.</div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; color: #5C5A60">Got it</span>
      <div style="display: flex; gap: 8px">
        <div style="flex: 1; background: #FFFFFF; border: 1px solid #E4DFD8; border-radius: 14px; padding: 8px; display: flex; flex-direction: column; gap: 6px; align-items: center">
          <img src="img/essence.svg" alt="Snail essence" style="width: 64px; height: 64px; border-radius: 10px; object-fit: cover">
          <span style="font-size: 12px; font-weight: 600; text-align: center">Snail Essence</span>
        </div>
        <div style="flex: 1; background: #FFFFFF; border: 1px solid #E4DFD8; border-radius: 14px; padding: 8px; display: flex; flex-direction: column; gap: 6px; align-items: center">
          <img src="img/toner.svg" alt="Rice toner" style="width: 64px; height: 64px; border-radius: 10px; object-fit: cover">
          <span style="font-size: 12px; font-weight: 600; text-align: center">Rice Toner</span>
        </div>
        <div style="flex: 1; background: #FFFFFF; border: 1px solid #E4DFD8; border-radius: 14px; padding: 8px; display: flex; flex-direction: column; gap: 6px; align-items: center">
          <img src="img/masks.svg" alt="Cica sheet masks" style="width: 64px; height: 64px; border-radius: 10px; object-fit: cover">
          <span style="font-size: 12px; font-weight: 600; text-align: center">Cica Masks</span>
        </div>
      </div>
      <span style="align-self: flex-start; font-size: 13px; font-weight: 600; padding: 6px 10px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E4DFD8">Your max: $75.00 all in</span>
    </div>

    <div style="background: #FFFFFF; border: 1px solid #E4DFD8; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; gap: 12px; align-items: center">
        <img src="img/essence-old.svg" alt="Snail essence in the old bottle" style="width: 52px; height: 52px; border-radius: 10px; object-fit: cover">
        <span style="font-size: 15px; line-height: 1.4"><b>One question.</b> The essence just got a new bottle. Same formula. Would you take the old bottle if it's cheaper?</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        
          <button type="button" style="min-height: 48px; border-radius: 14px; padding: 10px 14px; text-align: left; font-family: inherit; font-size: 15px; cursor: pointer; background: #FFFFFF; border: 1px solid #E4DFD8; color: #17161A;">New bottle only</button>
        
          <button type="button" style="min-height: 48px; border-radius: 14px; padding: 10px 14px; text-align: left; font-family: inherit; font-size: 15px; cursor: pointer; background: #FBE8EF; border: 2px solid #B4235A; color: #6E1437; font-weight: 700;">Old bottle is fine if it’s $4+ cheaper</button>
        
          <button type="button" style="min-height: 48px; border-radius: 14px; padding: 10px 14px; text-align: left; font-family: inherit; font-size: 15px; cursor: pointer; background: #FFFFFF; border: 1px solid #E4DFD8; color: #17161A;">Either bottle is fine</button>
        
      </div>
    </div>
  </div>

  <div style="padding: 14px 20px 22px">
    <a href="3-review.html" style="display: flex; align-items: center; justify-content: center; min-height: 54px; border-radius: 16px; background: #B4235A; color: #FFFFFF; font-weight: 700; font-size: 17px; text-decoration: none">Continue</a>
  </div>
</div>
</body>
</html>
