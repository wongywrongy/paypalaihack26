<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rally — quick question</title>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B4235A}a:hover{color:#8E1A47}
</style>

</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F7F4F0; color: #17161A; font-family: 'Schibsted Grotesk', system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="padding: 22px 20px 0; display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 14px; color: #5C5A60">Aisha · quick question</span>
    <h1 style="margin: 0; font-size: 28px; line-height: 1.15; font-weight: 800; letter-spacing: -0.02em">Want the old bottle for less?</h1>
  </div>

  <div style="padding: 22px 20px 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
    <div style="background: #FFFFFF; border: 2px solid #17161A; border-radius: 18px; padding: 10px; display: flex; flex-direction: column; gap: 8px">
      <img src="img/essence.svg" alt="Snail essence in the new bottle" style="width: 100%; aspect-ratio: 1 / 1; border-radius: 12px; object-fit: cover">
      <span style="font-size: 14px; font-weight: 700">New bottle</span>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 16px">$23</span>
      <span style="font-size: 12px; color: #5C5A60">Your pick</span>
    </div>
    <div style="background: #FFFFFF; border: 1px solid #E4DFD8; border-radius: 18px; padding: 10px; display: flex; flex-direction: column; gap: 8px">
      <img src="img/essence-old.svg" alt="Snail essence in the old bottle" style="width: 100%; aspect-ratio: 1 / 1; border-radius: 12px; object-fit: cover">
      <span style="font-size: 14px; font-weight: 700">Old bottle</span>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 16px">$18</span>
      <span style="font-size: 12px; color: #5C5A60">Same formula</span>
    </div>
  </div>

  <p style="margin: 18px 20px 0; font-size: 15px; line-height: 1.5; color: #3E3C42">Switching saves about $6 with duty and tax. Prices may still move a little.</p>

  <div style="margin-top: auto; padding: 16px 20px 22px; display: flex; flex-direction: column; gap: 10px">
    <button type="button" style="min-height: 54px; border-radius: 16px; border: none; background: #B4235A; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 700; cursor: pointer">Keep the new bottle</button>
    <button type="button" style="min-height: 54px; border-radius: 16px; border: 1px solid #C9C3BA; background: #FFFFFF; color: #17161A; font-family: inherit; font-size: 17px; font-weight: 600; cursor: pointer">Switch to the old bottle</button>
    <span style="font-size: 12px; color: #5C5A60; text-align: center">No answer in 10 minutes keeps the new bottle.</span>
  </div>
</div>
</body>
</html>
