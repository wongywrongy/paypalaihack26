<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rally — ship to</title>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B4235A}a:hover{color:#8E1A47}
</style>

</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #8A8580; color: #17161A; font-family: 'Schibsted Grotesk', system-ui, sans-serif; display: flex; flex-direction: column; justify-content: flex-end">
  <div style="background: #F7F4F0; border-radius: 24px 24px 0 0; padding: 12px 20px 24px; display: flex; flex-direction: column; gap: 14px">
    <span style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #D8D2C9"></span>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.02em">Ship to</h1>
      <span style="font-size: 14px; line-height: 1.45; color: #3E3C42">Your bag, all in, in each country. Duty and tax are paid before it ships.</span>
    </div>

    <div role="radiogroup" aria-label="Destination country" style="display: flex; flex-direction: column; gap: 8px">
      
        <button type="button" role="radio" aria-checked="true" style="display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 60px; padding: 10px 14px; border-radius: 14px; font-family: inherit; color: #17161A; cursor: pointer; background: #FBE8EF; border: 2px solid #B4235A;">
          <span style="display: flex; flex-direction: column; gap: 2px; text-align: left">
            <span style="font-size: 15px; font-weight: 700">United States</span>
            <span style="font-size: 12px; color: #5C5A60">12.5% duty · sales tax (est.)</span>
          </span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600">$118.82</span>
        </button>
      
        <button type="button" role="radio" aria-checked="false" style="display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 60px; padding: 10px 14px; border-radius: 14px; font-family: inherit; color: #17161A; cursor: pointer; background: #FFFFFF; border: 1px solid #E4DFD8;">
          <span style="display: flex; flex-direction: column; gap: 2px; text-align: left">
            <span style="font-size: 15px; font-weight: 700">Canada</span>
            <span style="font-size: 12px; color: #5C5A60">No duty · 13% HST</span>
          </span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600">C$160.87</span>
        </button>
      
        <button type="button" role="radio" aria-checked="false" style="display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 60px; padding: 10px 14px; border-radius: 14px; font-family: inherit; color: #17161A; cursor: pointer; background: #FFFFFF; border: 1px solid #E4DFD8;">
          <span style="display: flex; flex-direction: column; gap: 2px; text-align: left">
            <span style="font-size: 15px; font-weight: 700">United Kingdom</span>
            <span style="font-size: 12px; color: #5C5A60">No duty · 20% VAT</span>
          </span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600">£93.61</span>
        </button>
      
        <button type="button" role="radio" aria-checked="false" style="display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 60px; padding: 10px 14px; border-radius: 14px; font-family: inherit; color: #17161A; cursor: pointer; background: #FFFFFF; border: 1px solid #E4DFD8;">
          <span style="display: flex; flex-direction: column; gap: 2px; text-align: left">
            <span style="font-size: 15px; font-weight: 700">Germany</span>
            <span style="font-size: 12px; color: #5C5A60">€3 EU duty · 19% VAT</span>
          </span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600">€111.05</span>
        </button>
      
        <button type="button" role="radio" aria-checked="false" style="display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 60px; padding: 10px 14px; border-radius: 14px; font-family: inherit; color: #17161A; cursor: pointer; background: #FFFFFF; border: 1px solid #E4DFD8;">
          <span style="display: flex; flex-direction: column; gap: 2px; text-align: left">
            <span style="font-size: 15px; font-weight: 700">Australia</span>
            <span style="font-size: 12px; color: #5C5A60">No duty · 10% GST</span>
          </span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600">A$172.60</span>
        </button>
      
    </div>

    <div style="background: #FFFFFF; border: 1px solid #E4DFD8; border-radius: 16px; padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0B5A3C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 2px"><path d="M5 12l5 5L20 7"></path></svg>
      <span style="font-size: 13px; line-height: 1.45">Pay in US dollars with PayPal. Nothing more at your door.</span>
    </div>

    <a href="1-shop.html" style="display: flex; align-items: center; justify-content: center; min-height: 54px; border-radius: 16px; background: #B4235A; color: #FFFFFF; font-weight: 700; font-size: 17px; text-decoration: none">Done</a>
  </div>
</div>
</body>
</html>
