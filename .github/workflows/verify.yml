name: Verify sandbox application
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: coalition
          POSTGRES_PASSWORD: coalition
          POSTGRES_DB: coalition_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U coalition"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      COALITION_MODE: fixture
      COALITION_TEST_DATABASE_URL: postgresql://coalition:coalition@localhost:5432/coalition_test
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt ruff
      - run: python -m unittest discover -s tests -v
      - run: ruff check --isolated --select E4,E7,E9,F,I --ignore E402 backend tests scripts
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: cd frontend && npx playwright install --with-deps chromium
      - run: npm run test:browser --prefix frontend -- tests/buyer.spec.ts tests/checkout.spec.ts tests/storefront.spec.ts tests/negotiation-ui.spec.ts
