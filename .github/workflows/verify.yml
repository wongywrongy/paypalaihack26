name: Verify sandbox application
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rally
          POSTGRES_PASSWORD: rally
          POSTGRES_DB: rally_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rally"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RALLY_MODE: connected
      RALLY_TEST_DATABASE_URL: postgresql://rally:rally@localhost:5432/rally_test
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt ruff
      - run: python -m unittest discover -s tests -v
      - run: ruff check --isolated --select E4,E7,E9,F,I --ignore E402 backend tests scripts
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
      - run: npm run test:render --prefix frontend
      - name: Capture screens with Playwright CLI and runner Chrome
        timeout-minutes: 3
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          XDG_CACHE_HOME: ${{ runner.temp }}/rally-playwright-cache
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/rally-playwright-cli" --no-save --package-lock=false --no-audit --no-fund @playwright/cli@0.1.22
          cli="$RUNNER_TEMP/rally-playwright-cli/node_modules/.bin/playwright-cli"
          google-chrome --version
          cd frontend
          mkdir -p design/screenshots
          ./node_modules/.bin/vite --host 127.0.0.1 --port 5173 --strictPort > "$RUNNER_TEMP/rally-vite.log" 2>&1 &
          vite_pid=$!
          trap 'exit_status=$?; if (( exit_status != 0 )); then timeout 10 "$cli" -s=rally-gd console error || true; fi; timeout 10 "$cli" -s=rally-gd close || true; kill "$vite_pid" 2>/dev/null || true; wait "$vite_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --max-time 2 http://127.0.0.1:5173/invite > /dev/null; then break; fi
            if ! kill -0 "$vite_pid" 2>/dev/null; then cat "$RUNNER_TEMP/rally-vite.log"; exit 1; fi
            sleep 1
          done
          curl --fail --silent --show-error --max-time 2 http://127.0.0.1:5173/invite > /dev/null
          wait_fonts='async page => { await page.evaluate(() => document.fonts.ready); }'
          check_layout='async page => {
            const layout = await page.evaluate(() => ({
              scrollWidth: document.documentElement.scrollWidth,
              clientWidth: document.documentElement.clientWidth,
              innerWidth: window.innerWidth,
              offenders: [...document.querySelectorAll("body *")].map(element => ({
                tag: element.tagName,
                id: element.id,
                classes: (element.getAttribute("class") || "").slice(0, 120),
                left: element.getBoundingClientRect().left,
                right: element.getBoundingClientRect().right
              })).filter(rect => rect.left < 0 || rect.right > window.innerWidth).slice(0, 8)
            }));
            if (layout.scrollWidth > layout.innerWidth) throw new Error("Horizontal page overflow: " + JSON.stringify(layout));
          }'
          "$cli" -s=rally-gd open http://127.0.0.1:5173/invite --browser chrome
          "$cli" -s=rally-gd resize 390 844
          "$cli" -s=rally-gd set-reduced-motion reduce
          for route in invite tell review live ask done receipt deal; do
            "$cli" -s=rally-gd goto "http://127.0.0.1:5173/$route"
            "$cli" -s=rally-gd run-code "$wait_fonts"
            "$cli" -s=rally-gd screenshot --filename "design/screenshots/$route-cli-mobile.png" --full-page
            "$cli" -s=rally-gd run-code "$check_layout"
          done
          "$cli" -s=rally-gd resize 1440 900
          "$cli" -s=rally-gd goto http://127.0.0.1:5173/deal
          "$cli" -s=rally-gd run-code "$wait_fonts"
          "$cli" -s=rally-gd screenshot --filename design/screenshots/deal-cli-desktop.png --full-page
          "$cli" -s=rally-gd run-code "$check_layout"
          "$cli" -s=rally-gd console error
      - name: Install Chromium for browser tests
        timeout-minutes: 3
        run: cd frontend && npx playwright install chromium
      - run: npm run test:browser --prefix frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rally-browser-evidence
          path: |
            frontend/design/screenshots/*.png
            frontend/test-results/
            frontend/.playwright-cli/*.log
          if-no-files-found: ignore
          include-hidden-files: true
