# RETIRED: unbound provisioning template; do not apply or import.
# It does not match the paid project resources. See ../RENDER.md.
# Paid API, worker, and PostgreSQL. Review current Render prices before deployment.
# Use same-site custom domains, e.g. shop.example.com and api.example.com, for buyer cookies.
databases:
  - name: coalition-db
    databaseName: coalition
    user: coalition
    plan: 0.1c-256mb
    postgresMajorVersion: "16"
    ipAllowList: []
envVarGroups:
  - name: coalition-shared
    envVars:
      - key: RALLY_MODE
        value: connected
      - key: RALLY_DATABASE_SCHEMA
        value: rally
      - key: LLM_MODEL
        value: ""
      - key: LLM_BASE_URL
        value: ""
      - key: LLM_PROTOCOL
        value: openai
# Existing Render resource names are retained to preserve the database and services.
# Set PUBLIC_URL, PayPal credentials/merchant/webhook IDs, PAYPAL_SHOP_EMAIL,
# LLM_BASE_URL, LLM_MODEL and LLM_API_KEY in this
# shared group in the dashboard. sync:false is unsupported inside envVarGroups.
services:
  - type: web
    name: coalition-api
    runtime: python
    plan: 0.5c-512mb
    buildCommand: pip install -r backend/requirements.txt
    preDeployCommand: PYTHONPATH=backend python -m rally.db
    startCommand: PYTHONPATH=backend uvicorn rally.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - fromGroup: coalition-shared
      - key: DATABASE_URL
        fromDatabase: { name: coalition-db, property: connectionString }
  - type: worker
    name: coalition-worker
    runtime: python
    plan: 0.5c-512mb
    numInstances: 1
    buildCommand: pip install -r backend/requirements.txt
    startCommand: PYTHONPATH=backend python -m rally.worker
    envVars:
      - fromGroup: coalition-shared
      - key: DATABASE_URL
        fromDatabase: { name: coalition-db, property: connectionString }
  - type: web
    name: coalition-storefront
    runtime: static
    buildCommand: npm ci --prefix frontend && npm run build --prefix frontend
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
